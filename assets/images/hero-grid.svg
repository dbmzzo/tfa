<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Synthwave grid sunset background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a39"/>
      <stop offset="0.45" stop-color="#2a1165"/>
      <stop offset="1" stop-color="#090313"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd66a"/>
      <stop offset="1" stop-color="#ff7f44"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d0ff"/>
      <stop offset="1" stop-color="#ff4ac7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="180" cy="130" r="2"/><circle cx="360" cy="190" r="2"/><circle cx="1260" cy="120" r="2"/>
    <circle cx="1450" cy="230" r="2"/><circle cx="1150" cy="80" r="2"/><circle cx="730" cy="150" r="2"/>
    <circle cx="880" cy="90" r="2"/><circle cx="1010" cy="170" r="2"/><circle cx="200" cy="260" r="2"/>
  </g>
  <rect x="0" y="450" width="1600" height="8" fill="url(#haze)" opacity="0.9"/>
  <circle cx="800" cy="450" r="220" fill="url(#sun)"/>
  <g stroke="#8a2cff" stroke-width="4" opacity="0.7">
    <line x1="0" y1="560" x2="1600" y2="560"/>
    <line x1="0" y1="620" x2="1600" y2="620"/>
    <line x1="0" y1="690" x2="1600" y2="690"/>
    <line x1="0" y1="770" x2="1600" y2="770"/>
    <line x1="0" y1="860" x2="1600" y2="860"/>
    <line x1="800" y1="560" x2="800" y2="900"/>
    <line x1="640" y1="560" x2="560" y2="900"/>
    <line x1="960" y1="560" x2="1040" y2="900"/>
    <line x1="490" y1="560" x2="350" y2="900"/>
    <line x1="1110" y1="560" x2="1250" y2="900"/>
    <line x1="350" y1="560" x2="160" y2="900"/>
    <line x1="1250" y1="560" x2="1440" y2="900"/>
  </g>
</svg>
