name: Deploy TFA Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload site to temporary directory
        run: |
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/tfa-site/"

      - name: Publish site on server
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            sudo mkdir -p "${{ secrets.DEPLOY_PATH }}" &&
            sudo rsync -av --delete /tmp/tfa-site/ "${{ secrets.DEPLOY_PATH }}/" &&
            sudo chown -R www-data:www-data "${{ secrets.DEPLOY_PATH }}" &&
            sudo nginx -t &&
            sudo systemctl reload nginx
          '
