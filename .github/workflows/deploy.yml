name: Deploy TFA Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SSH_PRIVATE_KEY }}" || (echo "Missing secret: SSH_PRIVATE_KEY" && exit 1)
          test -n "${DEPLOY_HOST}" || (echo "Missing secret: DEPLOY_HOST" && exit 1)
          test -n "${DEPLOY_USER}" || (echo "Missing secret: DEPLOY_USER" && exit 1)
          test -n "${DEPLOY_PATH}" || (echo "Missing secret: DEPLOY_PATH" && exit 1)

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_CONTENT="${{ secrets.SSH_PRIVATE_KEY }}"
          if [[ "${KEY_CONTENT}" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "${KEY_CONTENT}" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            # Optional fallback: allow base64-encoded private key in secret.
            printf '%s' "${KEY_CONTENT}" | tr -d '\r' | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload site to temporary directory
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/tfa-site/"

      - name: Publish site on server
        shell: bash
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" '
            sudo mkdir -p "'"${DEPLOY_PATH}"'" &&
            sudo rsync -av --delete /tmp/tfa-site/ "'"${DEPLOY_PATH}"'/" &&
            sudo chown -R www-data:www-data "'"${DEPLOY_PATH}"'" &&
            sudo nginx -t &&
            sudo systemctl reload nginx
          '
